<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>We've moved</title>
<meta http-equiv="refresh" content="3;url=https://www.mscunofficial.com/">
<style>
:root{--glass:rgba(255,255,255,.55);--glass-hi:rgba(255,255,255,.75);--line:rgba(255,255,255,.6);--ink:#1d1d1f;--ink-soft:rgba(29,29,31,.55);--ink-faint:rgba(29,29,31,.35);--accent:#0a84ff;--page-bg:transparent;--shadow-panel:0 10px 34px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.06)}
@media (prefers-color-scheme: dark){
  :root{--glass:rgba(32,32,36,.5);--glass-hi:rgba(44,44,48,.62);--line:rgba(255,255,255,.12);--ink:#f5f5f7;--ink-soft:rgba(245,245,247,.62);--ink-faint:rgba(245,245,247,.38);--accent:#409cff;--page-bg:radial-gradient(circle at 20% 10%,rgba(255,255,255,.05),transparent 55%),rgba(16,17,20,.78);--shadow-panel:0 10px 34px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.35)}
}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Inter,sans-serif;
  color:var(--ink);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at 15% 20%, rgba(10,132,255,.10), transparent 50%),
    radial-gradient(circle at 85% 80%, rgba(255,169,166,.12), transparent 50%),
    var(--page-bg, #f4f4f6);
  background-attachment:fixed;
}
.panel{
  width:min(440px,100%);
  padding:40px 36px 34px;
  text-align:center;
  background:var(--glass);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--line);
  border-radius:26px;
  box-shadow:var(--shadow-panel);
}
.dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--accent);
  margin:0 auto 18px;
  box-shadow:0 0 0 6px rgba(10,132,255,.14);
}
h1{
  font-weight:700;
  font-size:clamp(20px,5vw,26px);
  margin:0 0 10px;
  letter-spacing:-.02em;
}
p{
  font-size:14px;
  color:var(--ink-soft);
  margin:0 0 26px;
  line-height:1.5;
}
a.cta{
  display:inline-block;
  font-size:14px;
  font-weight:600;
  color:#fff;
  background:var(--accent);
  text-decoration:none;
  padding:11px 22px;
  border-radius:999px;
  box-shadow:0 8px 22px rgba(10,132,255,.28);
  transition:transform .2s ease;
}
a.cta:hover{transform:translateY(-1px)}
a.cta:active{transform:scale(.97)}
.url{
  margin-top:16px;
  font-size:11.5px;
  color:var(--ink-faint);
  word-break:break-all;
}
</style>
</head>
<body>
  <div class="panel">
    <div class="dot"></div>
    <h1>This page has moved</h1>
    <p>You'll be redirected automatically in a few seconds.</p>
    <a class="cta" href="https://www.mscunofficial.com/">Take me there now</a>
    <div class="url">https://www.mscunofficial.com/</div>
  </div>
</body>
</html>
